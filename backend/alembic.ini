# Database migrations for the research API. The API applies them itself when it starts; these
# commands are for development and release pipelines. Run them from backend/:
#
#   alembic upgrade head                                  apply pending migrations
#   alembic current                                       show the database's revision
#   alembic revision --autogenerate -m "add audit log"   write a migration after changing
#                                                         eyeref/db/models.py, then review it
#
# The database is EYEREF_DATABASE_URL (default sqlite:///./data/eyeref.db).

[alembic]
script_location = %(here)s/eyeref/db/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
